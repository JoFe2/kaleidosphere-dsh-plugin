name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # P2B5C rollback/provenance tests inspect the frozen public baseline and
      # integrated commit ranges, so CI must retain full reachable history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify:package
      - run: timeout 300 npm run test:dsh
      - run: timeout 300 npm run test:dsh-agent
